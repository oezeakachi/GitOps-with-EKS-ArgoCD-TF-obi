name: Deploy ArgoCD Application

on:
  workflow_dispatch:
    inputs:
      cluster_name:
        description: 'EKS Cluster Name (leave empty to use output from Deploy EKS Cluster workflow)'
        required: false
        default: ''
  repository_dispatch:
    types: [deploy_argocd_app]

jobs:
  deploy-argocd-application:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install kubectl
        uses: aws-actions/setup-kubectl@v1

      - name: Set up AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Validate AWS Credentials
        run: aws sts get-caller-identity

      - name: Set EKS Cluster Name
        run: |
          if [ -n "${{ github.event.inputs.cluster_name }}" ]; then
            echo "CLUSTER_NAME=${{ github.event.inputs.cluster_name }}" >> $GITHUB_ENV
          elif [ -n "${{ github.event.client_payload.cluster_name }}" ]; then
            echo "CLUSTER_NAME=${{ github.event.client_payload.cluster_name }}" >> $GITHUB_ENV
          else
            echo "EKS cluster name is required."
            exit 1
          fi

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$CLUSTER_NAME" --region eu-west-1

      - name: Apply ArgoCD Application Manifest
        run: kubectl apply -f ./argocd_manifest.yaml

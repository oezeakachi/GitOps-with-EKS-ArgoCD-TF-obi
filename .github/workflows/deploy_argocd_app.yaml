name: Deploy to EKS

on:
  workflow_dispatch:
    inputs:
      cluster_name:
        description: 'EKS Cluster Name (optional if secret is used)'
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: eu-west-1
      AWS_DEFAULT_REGION: eu-west-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine Cluster Name
        run: |
          if [ -n "${{ inputs.cluster_name }}" ]; then
            echo "CLUSTER_NAME=${{ inputs.cluster_name }}" >> $GITHUB_ENV
          elif [ -n "${{ secrets.CLUSTER_NAME }}" ]; then
            echo "CLUSTER_NAME=${{ secrets.CLUSTER_NAME }}" >> $GITHUB_ENV
          else
            echo "EKS cluster name is required."
            exit 1
          fi

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name $CLUSTER_NAME --region $AWS_REGION

      - name: Deploy to EKS (placeholder)
        run: |
          echo "Deploying to cluster: $CLUSTER_NAME"
          # kubectl apply -f k8s/deployment.yaml

